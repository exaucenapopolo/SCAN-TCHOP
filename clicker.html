<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clicker - SCAN&TCHOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #fdf8f4;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .container {
            max-width:500px;
            width:100%;
            background:#fff;
            border-radius:32px;
            padding:32px 28px;
            box-shadow:0 20px 40px rgba(0,0,0,0.06);
            border:1px solid #e2e8f0;
            text-align:center;
        }
        h1 {
            font-family:'Playfair Display',serif;
            font-weight:700;
            font-size:2rem;
            color:#0b1a2e;
        }
        h1 i { color:#e67e22; }
        .sub { color:#64748b; margin-bottom:24px; }
        .stats {
            display:flex;
            justify-content:space-between;
            background:#f8fafc;
            padding:12px 20px;
            border-radius:16px;
            margin-bottom:24px;
            font-weight:600;
        }
        .stats .score { color:#e67e22; }
        .stats .timer { color:#0b1a2e; }
        .click-area {
            background:#f1f5f9;
            border-radius:24px;
            padding:40px 20px;
            cursor:pointer;
            transition:0.15s;
            border:3px dashed #e2e8f0;
            user-select:none;
            margin-bottom:20px;
        }
        .click-area:active { transform:scale(0.96); background:#fef3e8; }
        .click-area .big-icon {
            font-size:4rem;
            color:#e67e22;
        }
        .click-area .count {
            font-size:3rem;
            font-weight:800;
            color:#0b1a2e;
        }
        .btn-group {
            display:flex;
            gap:12px;
            justify-content:center;
            flex-wrap:wrap;
        }
        .btn {
            padding:12px 28px;
            border-radius:50px;
            font-weight:700;
            font-size:0.95rem;
            border:none;
            cursor:pointer;
            transition:0.3s;
            background:#e67e22;
            color:#fff;
            box-shadow:0 4px 16px rgba(230,126,34,0.25);
        }
        .btn:hover { transform:translateY(-3px); box-shadow:0 8px 28px rgba(230,126,34,0.35); background:#cf6f1b; }
        .btn-secondary { background:#64748b; box-shadow:0 4px 16px rgba(100,116,139,0.2); }
        .btn-secondary:hover { background:#475569; }
        .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
        .result { margin:16px 0; font-weight:700; font-size:1.2rem; color:#10b981; display:none; }
        @media (max-width:480px) { .container { padding:20px 16px; } }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="fas fa-hand-pointer"></i> Clicker</h1>
    <p class="sub">Cliquez le plus vite possible pendant 10 secondes !</p>
    <div class="stats">
        <span>⚡ Score : <span class="score" id="score">0</span></span>
        <span>⏱️ Temps : <span class="timer" id="timer">10</span>s</span>
    </div>
    <div class="click-area" id="clickArea">
        <div class="big-icon"><i class="fas fa-hand-paper"></i></div>
        <div class="count" id="clickCount">0</div>
        <p style="color:#64748b; margin-top:8px;">Cliquez ici !</p>
    </div>
    <div class="result" id="result">🎉 Vous avez cliqué <span id="finalScore">0</span> fois !</div>
    <div class="btn-group">
        <button class="btn" id="startBtn"><i class="fas fa-play"></i> Commencer</button>
        <a href="javascript:history.back()" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Retour</a>
    </div>
</div>
<script>
    let score = 0, timeLeft = 10, interval = null, playing = false;
    const scoreSpan = document.getElementById('score');
    const timerSpan = document.getElementById('timer');
    const clickCountSpan = document.getElementById('clickCount');
    const clickArea = document.getElementById('clickArea');
    const startBtn = document.getElementById('startBtn');
    const resultDiv = document.getElementById('result');
    const finalScoreSpan = document.getElementById('finalScore');

    function updateUI() {
        scoreSpan.textContent = score;
        clickCountSpan.textContent = score;
        timerSpan.textContent = timeLeft;
    }

    function startGame() {
        if (playing) return;
        score = 0;
        timeLeft = 10;
        playing = true;
        resultDiv.style.display = 'none';
        startBtn.disabled = true;
        updateUI();

        clickArea.addEventListener('click', handleClick);
        interval = setInterval(() => {
            timeLeft--;
            timerSpan.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(interval);
                playing = false;
                clickArea.removeEventListener('click', handleClick);
                startBtn.disabled = false;
                finalScoreSpan.textContent = score;
                resultDiv.style.display = 'block';
                if (navigator.vibrate) navigator.vibrate(100);
                playEndSound();
            }
        }, 1000);
    }

    function handleClick() {
        if (!playing) return;
        score++;
        scoreSpan.textContent = score;
        clickCountSpan.textContent = score;
        clickArea.style.transform = 'scale(0.94)';
        setTimeout(() => clickArea.style.transform = 'scale(1)', 80);
    }

    function playEndSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } catch(e){}
    }

    startBtn.addEventListener('click', startGame);
</script>
</body>
</html>
