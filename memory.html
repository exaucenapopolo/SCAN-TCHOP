<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --primary: #0f172a;
            --accent: #e67e22;
            --success: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .app-container {
            max-width: 500px; /* Plus étroit pour un look application mobile */
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-weight: 800;
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 i {
            color: var(--accent);
        }

        .instructions {
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
            text-align: center;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
        }

        .stats div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stats span {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            perspective: 1000px; /* Nécessaire pour l'effet 3D */
        }

        .card {
            aspect-ratio: 1;
            cursor: pointer;
            position: relative;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner, .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Face avant (cachée au début) */
        .card-front {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            color: #cbd5e1;
        }

        .card-front i {
            font-size: 1.2rem;
            opacity: 0.5;
        }

        /* Dos de la carte (l'icône à trouver) */
        .card-back {
            background: #fff;
            border: 2px solid var(--accent);
            transform: rotateY(180deg);
        }

        .card.matched .card-back {
            background: #d1fae5;
            border-color: var(--success);
            opacity: 0.8;
        }

        .win-message {
            text-align: center;
            background: #d1fae5;
            color: #065f46;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            margin-top: 24px;
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.2);
        }

        .btn-primary:hover {
            background: #cf6f1b;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        @media (max-width: 480px) {
            .app-container { padding: 24px 16px; border-radius: 20px; }
            .grid { gap: 8px; }
            .card-front, .card-back { font-size: 1.8rem; border-radius: 12px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-brain"></i> Memory</h1>
    </div>

    <div class="instructions">
        <strong>Comment jouer :</strong> Appuyez sur les cartes pour les retourner. Trouvez toutes les paires d'images identiques avec le moins d'essais possible !
    </div>

    <div class="stats">
        <div>
            <span>Tentatives</span>
            <strong id="attempts" style="color: var(--accent); font-size: 1.2rem;">0</strong>
        </div>
        <div>
            <span>Paires trouvées</span>
            <strong style="color: var(--success); font-size: 1.2rem;"><span id="matched">0</span> / 8</strong>
        </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="win-message" id="winMessage">
        🎉 Félicitations ! Vous avez une excellente mémoire.
    </div>

    <div class="actions">
        <button class="btn btn-secondary" onclick="safeGoBack()">
            <i class="fas fa-arrow-left"></i> Retour
        </button>
        <button class="btn btn-primary" onclick="location.reload()">
            <i class="fas fa-redo"></i> Rejouer
        </button>
    </div>
</div>

<script>
    // Utilisation d'emojis qui s'afficheront directement et sans erreur
    const icons = ['🍕','🍔','🌮','🥗','🍣','🍰','🍩','🥤'];
    let cards = [];
    let first = null, second = null, lock = false;
    let attempts = 0, matched = 0;
    
    const grid = document.getElementById('grid');
    const attemptsSpan = document.getElementById('attempts');
    const matchedSpan = document.getElementById('matched');
    const winMsg = document.getElementById('winMessage');

    // Mélange le tableau
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Initialise le jeu
    function initGame() {
        const deck = shuffle([...icons, ...icons]);
        cards = deck.map((icon, idx) => ({ id: idx, icon, matched: false, flipped: false }));
        render();
    }

    // Affiche les cartes avec la structure 3D
    function render() {
        grid.innerHTML = '';
        cards.forEach((card, index) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            if (card.flipped || card.matched) cardDiv.classList.add(card.matched ? 'matched' : 'flipped');
            
            // Structure interne pour l'animation 3D de retournement
            cardDiv.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <i class="fas fa-brain"></i>
                    </div>
                    <div class="card-back">
                        ${card.icon}
                    </div>
                </div>
            `;
            
            cardDiv.addEventListener('click', () => flipCard(index));
            grid.appendChild(cardDiv);
        });
    }

    // Logique lorsqu'on clique sur une carte
    function flipCard(index) {
        if (lock) return; // Empêche de cliquer pendant l'animation
        const card = cards[index];
        if (card.matched || card.flipped) return;
        
        card.flipped = true;
        render();
        
        if (first === null) {
            first = index;
            return;
        }
        
        second = index;
        lock = true; // Bloque la grille le temps de comparer
        attempts++;
        attemptsSpan.textContent = attempts;

        const firstCard = cards[first];
        const secondCard = cards[second];
        
        if (firstCard.icon === secondCard.icon) {
            // C'est une paire
            firstCard.matched = true;
            secondCard.matched = true;
            matched++;
            matchedSpan.textContent = matched;
            resetTurn();
            
            // Vérifie la victoire
            if (matched === 8) {
                setTimeout(() => {
                    winMsg.style.display = 'block';
                }, 500);
            }
        } else {
            // Ce n'est pas une paire, on retourne après un court délai
            setTimeout(() => {
                firstCard.flipped = false;
                secondCard.flipped = false;
                render();
                resetTurn();
            }, 1000); // 1 seconde de délai pour bien voir l'erreur
        }
    }

    function resetTurn() {
        first = null;
        second = null;
        lock = false;
    }

    // Bouton retour sécurisé
    function safeGoBack() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            // Si pas d'historique, on redirige vers la page d'accueil du site
            window.location.href = '/'; 
        }
    }

    // Lancer le jeu au chargement
    initGame();
</script>
</body>
</html>
