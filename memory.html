<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory - Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Bibliothèque pour les animations de confettis -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Variables de couleurs pour un design cohérent */
        :root {
            --primary: #0f172a;
            --accent: #e67e22;
            --success: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden; 
        }

        .app-container {
            max-width: 500px; 
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
        }

        .header { text-align: center; margin-bottom: 24px; }
        h1 { font-weight: 800; font-size: 1.8rem; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        h1 i { color: var(--accent); }

        .instructions { background: #f1f5f9; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; text-align: center; }

        .stats { display: flex; justify-content: space-between; background: #f8fafc; padding: 16px; border-radius: 16px; margin-bottom: 24px; font-weight: 600; border: 1px solid #e2e8f0; }
        .stats div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .stats span { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Grille du jeu */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; perspective: 1000px; }
        .card { aspect-ratio: 1; cursor: pointer; position: relative; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        
        .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .card-front { background: #f8fafc; border: 2px solid #e2e8f0; color: #cbd5e1; }
        .card-front i { font-size: 1.2rem; opacity: 0.5; }
        .card-back { background: #fff; border: 2px solid var(--accent); transform: rotateY(180deg); }
        .card.matched .card-back { background: #d1fae5; border-color: var(--success); opacity: 0.8; }

        .win-message { text-align: center; background: #d1fae5; color: #065f46; padding: 16px; border-radius: 12px; font-weight: 700; margin-top: 24px; display: none; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Boutons d'action - Mis à jour pour un seul bouton */
        .actions { display: grid; grid-template-columns: 1fr; margin-top: 24px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; border: none; text-decoration: none; }
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(230, 126, 34, 0.2); }
        .btn-primary:hover { background: #cf6f1b; transform: translateY(-2px); }

        /* Adaptabilité pour les petits écrans (mobiles) */
        @media (max-width: 480px) {
            .app-container { padding: 24px 16px; border-radius: 20px; }
            .grid { gap: 8px; }
            .card-front, .card-back { font-size: 1.8rem; border-radius: 12px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-brain"></i> Memory</h1>
    </div>

    <div class="instructions">
        <strong>Comment jouer :</strong> Appuyez sur les cartes pour les retourner. Trouvez toutes les paires d'images identiques !
    </div>

    <div class="stats">
        <div><span>Tentatives</span><strong id="attempts" style="color: var(--accent); font-size: 1.2rem;">0</strong></div>
        <div><span>Paires</span><strong style="color: var(--success); font-size: 1.2rem;"><span id="matched">0</span> / 8</strong></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="win-message" id="winMessage">
        🎉 Félicitations ! Vous avez une excellente mémoire.
    </div>

    <div class="actions">
        <!-- Bouton unique pour relancer la partie -->
        <button class="btn btn-primary" onclick="location.reload()">
            <i class="fas fa-redo"></i> Rejouer
        </button>
    </div>
</div>

<script>
    /* =========================================
       1. SYSTÈME AUDIO AVANCÉ (MÉLODIES)
       ========================================= */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Fonction qui joue une note précise à un instant précis
    function playNote(frequency, startTime, duration, type = 'triangle', vol = 0.1) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = type; 
        oscillator.frequency.value = frequency;
        
        // Enveloppe sonore pour éviter les "clics"
        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(vol, startTime + 0.02); 
        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration); 
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start(startTime);
        oscillator.stop(startTime + duration);
    }

    // Gestionnaire des effets sonores et haptiques
    const FX = {
        click: () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            playNote(400, audioCtx.currentTime, 0.1, 'sine', 0.05);
            if('vibrate' in navigator) navigator.vibrate(20); 
        },
        error: () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            playNote(150, audioCtx.currentTime, 0.3, 'sawtooth', 0.05);
            if('vibrate' in navigator) navigator.vibrate(150); 
        },
        success: () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            // Arpège ascendant : Do5 - Mi5 - Sol5
            playNote(523.25, now, 0.15);         
            playNote(659.25, now + 0.1, 0.15);   
            playNote(783.99, now + 0.2, 0.3);    
            if('vibrate' in navigator) navigator.vibrate([50, 30, 50]); 
        },
        win: () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            // Fanfare triomphale de victoire
            playNote(261.63, now, 0.2);        // Do4
            playNote(329.63, now + 0.2, 0.2);  // Mi4
            playNote(392.00, now + 0.4, 0.2);  // Sol4
            playNote(523.25, now + 0.6, 0.4);  // Do5
            playNote(392.00, now + 1.0, 0.2);  // Sol4 (descente)
            playNote(523.25, now + 1.2, 0.8);  // Do5 (note finale longue)
            
            if('vibrate' in navigator) navigator.vibrate([200, 100, 200, 100, 400]);
        }
    };

    /* =========================================
       2. SYSTÈME DE CONFETTIS
       ========================================= */
    function triggerConfetti() {
        var duration = 3000; 
        var end = Date.now() + duration;

        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#e67e22', '#10b981', '#f1c40f'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#e67e22', '#10b981', '#f1c40f'] });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    /* =========================================
       3. LOGIQUE DU JEU
       ========================================= */
    const icons = ['🍕','🍔','🌮','🥗','🍣','🍰','🍩','🥤'];
    let cards = [];
    let first = null, second = null, lock = false;
    let attempts = 0, matched = 0;
    
    const grid = document.getElementById('grid');
    const attemptsSpan = document.getElementById('attempts');
    const matchedSpan = document.getElementById('matched');
    const winMsg = document.getElementById('winMessage');

    // Algorithme pour mélanger les cartes
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initGame() {
        const deck = shuffle([...icons, ...icons]);
        cards = deck.map((icon, idx) => ({ id: idx, icon, matched: false, flipped: false }));
        render();
    }

    // Affichage des cartes
    function render() {
        grid.innerHTML = '';
        cards.forEach((card, index) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            if (card.flipped || card.matched) cardDiv.classList.add(card.matched ? 'matched' : 'flipped');
            
            cardDiv.innerHTML = `
                <div class="card-inner">
                    <div class="card-front"><i class="fas fa-brain"></i></div>
                    <div class="card-back">${card.icon}</div>
                </div>
            `;
            
            cardDiv.addEventListener('click', () => flipCard(index));
            grid.appendChild(cardDiv);
        });
    }

    // Comportement au clic d'une carte
    function flipCard(index) {
        if (lock) return; 
        const card = cards[index];
        if (card.matched || card.flipped) return;
        
        card.flipped = true;
        render();
        
        FX.click();

        if (first === null) {
            first = index;
            return;
        }
        
        second = index;
        lock = true; 
        attempts++;
        attemptsSpan.textContent = attempts;

        const firstCard = cards[first];
        const secondCard = cards[second];
        
        if (firstCard.icon === secondCard.icon) {
            // L'utilisateur trouve une bonne paire
            firstCard.matched = true;
            secondCard.matched = true;
            matched++;
            matchedSpan.textContent = matched;
            
            FX.success(); 
            resetTurn();
            
            // Vérification de la victoire
            if (matched === 8) {
                setTimeout(() => {
                    winMsg.style.display = 'block';
                    FX.win(); 
                    triggerConfetti();
                }, 500);
            }
        } else {
            // L'utilisateur se trompe
            setTimeout(() => {
                FX.error(); 
                firstCard.flipped = false;
                secondCard.flipped = false;
                render();
                resetTurn();
            }, 1000); 
        }
    }

    function resetTurn() {
        first = null;
        second = null;
        lock = false;
    }

    // Lancer le jeu
    initGame();
</script>
</body>
</html>
